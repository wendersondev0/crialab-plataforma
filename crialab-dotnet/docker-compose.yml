services:
  db:
    image: postgres:16-alpine
    container_name: crialab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crialab
    ports:
      - "5433:5432"
    volumes:
      - crialab_pgdata:/var/lib/postgresql/data

volumes:
  crialab_pgdata:
